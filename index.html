<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JRUN LAB - Modelo 3 Zonas</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 95%;
      max-width: 600px;
      background: #111;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 140, 0, 0.2);
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: orange;
    }
    p {
      text-align: center;
      color: #ccc;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-top: 15px;
      font-size: 16px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
      background: orange;
      cursor: pointer;
    }
    .result {
      margin-top: 20px;
      background: #1a1a1a;
      padding: 15px;
      border-radius: 15px;
    }
    .zone {
      margin-bottom: 10px;
    }
    .comment {
      margin-top: 15px;
      font-size: 13px;
      background: rgba(255, 140, 0, 0.1);
      padding: 10px;
      border-radius: 10px;
    }
    .cta {
      display: block;
      margin-top: 20px;
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      background: #000;
      border: 1px solid orange;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }
    .cta:hover {
      background: orange;
      color: #000;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Modelo de 3 Zonas</h1>
    <p>Introduce tu VAM en formato min/km (ej: 3:15)</p>

    <input type="text" id="vam" placeholder="3:15" />
    <button onclick="calcular()">Calcular</button>

    <div id="resultado" class="result" style="display:none;"></div>
  </div>

  <script>
    function paceToSeconds(pace) {
      const parts = pace.split(":");
      return parseInt(parts[0]) * 60 + parseInt(parts[1]);
    }

    function secondsToPace(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.round(seconds % 60);
      return min + ":" + (sec < 10 ? "0" + sec : sec);
    }

    function calcular() {
      const vamInput = document.getElementById("vam").value;
      if (!vamInput.includes(":")) return;

      const vamSeg = paceToSeconds(vamInput);

      const pctZ1 = 0.65;
      const pctU1 = 0.66;
      const pctU2 = 0.83;

      const ritmoZ1 = vamSeg / pctZ1;
      const ritmoU1 = vamSeg / pctU1;
      const ritmoU2 = vamSeg / pctU2;

      const html = `
        <div class="zone"><strong>Zona 1:</strong> Por debajo de ${secondsToPace(ritmoZ1)} (<65%)</div>
        <div class="zone"><strong>Umbral 1:</strong> En torno a ${secondsToPace(ritmoU1)} (≈66%)</div>
        <div class="zone"><strong>Zona 2:</strong> Entre ${secondsToPace(ritmoU1)} y ${secondsToPace(ritmoU2)} (66% - 83%)</div>
        <div class="zone"><strong>Umbral 2:</strong> En torno a ${secondsToPace(ritmoU2)} (≈83%)</div>
        <div class="zone"><strong>Zona 3:</strong> Entre ${secondsToPace(ritmoU2)} y ${vamInput} (83% - 100%)</div>
        <div class="comment">Se está utilizando un modelo de 3 zonas de entrenamiento, es el más práctico para trabajar.</div>
        <a class="cta" href="https://wa.link/ds6qw3" target="_blank">Quiero mejorar mi rendimiento con una planificación individualizada y profesional</a>
      `;

      const resultadoDiv = document.getElementById("resultado");
      resultadoDiv.innerHTML = html;
      resultadoDiv.style.display = "block";
    }
  </script>
</body>
</html>
